.app{max-width:1180px;margin:0 auto;padding:0 26px 105px}.hero{max-width:1180px!important;margin:22px auto 0!important;padding:25px 30px 28px!important;border-radius:25px!important;background:#202b52!important;color:#fff;box-shadow:0 18px 45px #1d2b5a24!important;position:relative;isolation:isolate}.hero:before{content:"N";position:absolute;z-index:-1;left:30px;top:-65px;font-size:250px;font-weight:950;line-height:1;color:#ffffff08;transform:rotate(-10deg)}.hero:after{content:"LOCAL WORKSPACE  /  PROJECTS";position:absolute;left:30px;bottom:28px;color:#aebaf1;font-size:9px;font-weight:900;letter-spacing:2px}.brand{font-size:23px!important;letter-spacing:-.7px;gap:9px}.brand img{width:38px!important}.brand b{color:#ff907e!important}.hero p{margin:15px 0 2px!important;color:#b8c4ee!important;font-size:12px;letter-spacing:.3px}.hero h1{font-size:clamp(24px,4vw,34px)!important;font-weight:850;letter-spacing:-1px}.hero small{color:#9eaddd!important}.wrap{padding:28px 0!important}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stat{border:1px solid #e7e9f1!important;border-radius:19px!important;padding:18px 20px!important;background:#fff!important;box-shadow:0 10px 28px #26345b08!important;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:54px;height:54px;border-radius:18px;right:-17px;bottom:-25px;background:#edf0ff;transform:rotate(25deg)}.stat small{color:#858ba0!important;font-weight:700}.stat strong{font-size:30px!important;color:#263fce!important;font-weight:900}.head{margin:33px 0 14px!important}.head h3{font-size:22px!important;font-weight:900;letter-spacing:-.5px}.btn{border-radius:12px!important;min-height:43px;padding:10px 16px!important;font-weight:800;transition:.18s ease}.btn:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 9px 20px #1f34701c}.primary{background:#2347e8!important;color:#fff!important}.orange{background:#ff765e!important;color:#fff!important}.soft{background:#f0f2ff!important;color:#3349bd!important;border:1px solid #e2e6ff!important}.toolbar{display:flex;gap:10px;align-items:center;padding:9px 12px!important;border:1px solid #e5e8f0!important;border-radius:16px!important;background:#fff!important;box-shadow:0 8px 24px #1c2a5008!important}.toolbar input{margin:0!important;border:0!important;background:transparent!important;box-shadow:none!important;color:#20263a!important;min-height:42px}.toolbar input::placeholder{color:#9ba1b1!important}.grid{gap:16px!important;margin-top:17px}.project-card{padding:21px!important;border-radius:21px!important;background:#fff!important;border:1px solid #e6e8f0!important;box-shadow:0 12px 32px #202b5209!important;position:relative;overflow:hidden}.project-card:before{inset:0 auto 0 0!important;width:4px!important;height:auto!important;background:linear-gradient(180deg,#2347e8,#ff8877)!important}.project-card:hover{transform:translateY(-4px)!important;border-color:#cbd3ff!important;box-shadow:0 18px 38px #263fce13!important}.projtop{align-items:center!important}.ico{width:49px!important;height:49px!important;border-radius:16px!important;background:#edf0ff!important;color:#314bd1!important;border:0!important;font-size:22px!important}.name{font-size:17px!important;color:#1b2031!important;font-weight:900}.muted{color:#8a90a2!important}.tag{background:#f2f3f8!important;color:#626b82!important;border:1px solid #e9ebf2!important;border-radius:8px!important;font-weight:700}.project-card .row{margin-top:16px}.project-card .row .btn{min-width:82px}.empty{grid-column:1/-1;padding:48px 20px!important;background:#fff!important;border:1px dashed #cfd4e4!important;border-radius:20px!important;color:#82899c!important}.nav{z-index:20;left:50%!important;right:auto!important;bottom:18px!important;transform:translateX(-50%);width:min(430px,calc(100% - 28px));justify-content:space-around!important;gap:5px!important;padding:9px!important;border:1px solid #e3e6f0!important;border-radius:18px!important;background:#202b52!important;box-shadow:0 15px 45px #17234b35!important}.nav button{color:#d9e0ff!important;font-size:12px!important;font-weight:800!important;padding:10px 13px!important;border-radius:11px!important}.nav button:hover{background:#344477!important;color:#fff!important}.modal{z-index:30;background:#141c37b8!important;backdrop-filter:blur(9px)!important;align-items:center!important}.sheet{width:min(600px,100%)!important;border:1px solid #e7e9f2!important;border-radius:25px!important;background:#fff!important;color:#1b2031!important;box-shadow:0 30px 90px #101a3a45!important;padding:25px!important}.sheet h2{font-size:22px;font-weight:900;color:#202b52}.sheet label{font-size:13px;font-weight:800;color:#5e6579}.close{background:#f0f2f8!important;color:#5d6680!important;border-radius:11px!important;cursor:pointer}.sheet input,.sheet textarea,.sheet select{background:#f8f9fc!important;color:#20263a!important;border:1px solid #e2e6ef!important;border-radius:12px!important;min-height:45px;padding:11px 13px!important}.sheet input:focus,.sheet textarea:focus,.sheet select:focus{outline:3px solid #2347e81b;border-color:#8798f7!important}.sheet textarea{min-height:100px}.hidden{display:none!important}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:29px 34px 34px!important}.app{padding-left:32px;padding-right:32px}}
@media(max-width:600px){.hero{margin:10px 10px 0!important;padding:21px 19px 25px!important;border-radius:20px!important}.hero:after{display:none}.hero:before{font-size:175px;left:12px;top:-38px}.brand{font-size:21px!important}.brand img{width:34px!important}.hero p{margin-top:12px!important}.hero h1{font-size:25px!important}.app{padding:0 13px 105px}.wrap{padding:20px 0!important}.stats{gap:8px}.stat{padding:13px 10px!important;border-radius:15px!important}.stat small{font-size:10px}.stat strong{font-size:24px!important}.head{margin:25px 0 12px!important}.head h3{font-size:19px!important}.head .btn{padding:9px 11px!important;font-size:12px}.toolbar{gap:6px;padding:7px!important}.toolbar .btn{padding:8px 10px!important;font-size:11px}.grid{grid-template-columns:1fr;gap:12px!important}.project-card{padding:18px!important}.nav{bottom:10px!important}.nav button{font-size:11px!important;padding:9px 10px!important}.sheet{padding:19px!important;border-radius:21px!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

</style></head><body>
<header class="hero" style="max-width:1050px;margin:0 auto"><div class="brand"><img src="assets/icon-white.svg"><span>Nexa<b>Box</b></span></div><p>استوديو إدارة المشاريع الشخصية</p><h1>كل مشروع. بصورة أوضح.</h1><small>مساحة عمل محلية • بياناتك على جهازك</small></header>
<div id="app" class="app"><main class="wrap" id="main">
<div class="stats"><div class="stat"><small>المشاريع</small><strong id="count">0</strong></div><div class="stat"><small>قيد التطوير</small><strong id="activeCount">0</strong></div><div class="stat"><small>مكتملة</small><strong id="doneCount">0</strong></div></div>
<div class="head"><h3>مشاريعي</h3><button class="btn orange" onclick="openForm()">＋ إضافة مشروع</button></div>
<div class="toolbar"><input id="search" placeholder="ابحث عن مشروع..." oninput="render()" style="margin-bottom:0"><button class="btn soft" onclick="toggleView()" id="viewBtn">☷ عرض قائمة</button></div>
<div id="list" class="grid"></div>
</main></div>
<nav id="nav" class="nav"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ الرئيسية</button><button onclick="openForm()">＋ مشروع جديد</button></nav>
<div class="modal" id="formModal"><div class="sheet"><button class="close" onclick="closeForm()">✕</button><h2>إضافة / تعديل مشروع</h2><input id="pid" type="hidden"><label>اسم المشروع *</label><input id="pname" placeholder="اسم المشروع" maxlength="100"><label>رقم الإصدار</label><input id="pver" placeholder="1.0.0" maxlength="30"><label>الحالة</label><select id="pstatus" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:5px 0 12px;font:inherit"><option value="active">قيد التطوير</option><option value="done">مكتمل</option><option value="paused">متوقف مؤقتاً</option></select><label>تاريخ آخر تحديث</label><input id="pdate" type="date"><label>الوصف</label><textarea id="pdesc" placeholder="وصف مختصر"></textarea><button class="btn primary" style="width:100%" onclick="saveProject()">حفظ المشروع</button></div></div>
<script>
const DB='nexaboxLocalProjects',STORE='projects';let db,items=[],listMode=false;const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function req(mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),r=fn(tx.objectStore(STORE));r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function load(){items=await req('readonly',s=>s.getAll());render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!db)return;const q=($('search').value||'').trim().toLowerCase();const filtered=items.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q));$('count').textContent=items.length;$('activeCount').textContent=items.filter(p=>p.status==='active'||!p.status).length;$('doneCount').textContent=items.filter(p=>p.status==='done').length;$('list').classList.toggle('listview',listMode);$('viewBtn').textContent=listMode?'▦ عرض بطاقات':'☷ عرض قائمة';$('list').innerHTML=filtered.map(p=>`<article class="card project-card"><div class="projtop"><div class="ico">📁</div><div><div class="name">${esc(p.name)}</div><div class="muted">الإصدار ${esc(p.version||'—')}</div></div></div><div class="tags"><span class="tag">${p.status==='done'?'مكتمل':p.status==='paused'?'متوقف مؤقتاً':'قيد التطوير'}</span><span class="tag">آخر تحديث: ${esc(p.date||'—')}</span></div><p class="muted">${esc(p.desc||'لا يوجد وصف')}</p><div class="row"><button class="btn soft" onclick="editProject('${p.id}')">تعديل</button><button class="btn soft" onclick="deleteProject('${p.id}')">حذف</button></div></article>`).join('')||'<div class="empty">📂<p>لا توجد مشاريع مطابقة. أضف مشروعك الأول.</p></div>'}
function toggleView(){listMode=!listMode;render()}
function openForm(p=null){$('pid').value=p?.id||'';$('pname').value=p?.name||'';$('pver').value=p?.version||'1.0.0';$('pstatus').value=p?.status||'active';$('pdate').value=p?.date||new Date().toISOString().slice(0,10);$('pdesc').value=p?.desc||'';$('formModal').classList.add('show')}
function editProject(id){const p=items.find(x=>x.id===id);if(p)openForm(p)}
function closeForm(){$('formModal').classList.remove('show')}
async function saveProject(){const name=$('pname').value.trim(),version=$('pver').value.trim();if(!name)return alert('اسم المشروع مطلوب');const id=$('pid').value||crypto.randomUUID();const old=items.find(x=>x.id===id)||{};const p={id,name,version,status:$('pstatus').value,date:$('pdate').value,desc:$('pdesc').value.trim(),updatedAt:new Date().toISOString()};await req('readwrite',s=>s.put(p));closeForm();await load()}
async function deleteProject(id){const p=items.find(x=>x.id===id);if(!p||!confirm(`هل تريد حذف المشروع «${p.name}» من هذا الجهاز؟`))return;await req('readwrite',s=>s.delete(id));await load()}
window.addEventListener('load',async()=>{try{await openDB();await load()}catch(e){console.error(e);alert('تعذر فتح التخزين المحلي: '+e.message)}});
</script></body></html>
